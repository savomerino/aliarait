<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Contenido Interactivo - AliaraIT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- 
        Chosen Palette: AliaraIT Branding Palette. The colors are inspired by the branding materials provided (PDF and Website). Key colors:
        - Background: #121212 (Dark Gray/Black)
        - Primary Accent (Orange): #F85A40
        - Secondary Accent (Yellow): #F9A826
        - Text & Neutral: #FFFFFF, #F1F1F1, #A9A9A9
        - Surface: #1E1E1E, #2A2A2A
    -->
    <!-- 
        Application Structure Plan: A dynamic dashboard-style SPA. The structure includes:
        1. A header with the application title.
        2. An overview section with key stats (total posts, themes) and a donut chart visualizing the content pillar distribution. This gives an immediate, high-level summary.
        3. A filter/navigation bar to switch between two primary views: "Calendario" and "Pilares de Contenido".
        4. A main content area that dynamically displays either the calendar grid or the content pillars as interactive cards.
        5. A modal window for displaying the full details of a selected post (title, visual idea, copy, hashtags), triggered by clicking on a post from any view.
        6. A dedicated, collapsible section for "Ideas para Stories y Reels".
        This structure was chosen because a social media plan is non-linear. Users (e.g., a manager) need to see the schedule (Calendar View) but also understand the strategic distribution of topics (Pillar View). The modal prevents clutter and allows for easy deep-dives into content specifics.
    -->
    <!-- 
        Visualization & Content Choices:
        - Report Info: Post counts per pillar -> Goal: Compare proportions -> Viz/Method: Donut Chart (Chart.js). Justification: Provides a quick, visual understanding of the content strategy balance.
        - Report Info: Schedule of all posts -> Goal: Organize by time -> Viz/Method: Interactive Calendar Grid (HTML/CSS Grid + JS). Justification: The most intuitive way to visualize a monthly schedule. Interaction: Clickable posts.
        - Report Info: Grouped posts by theme -> Goal: Organize by theme/category -> Viz/Method: Interactive Cards (HTML/CSS Flexbox + JS). Justification: Allows users to focus on specific content strategies (e.g., "what are all our security posts?"). Interaction: Clickable posts.
        - Report Info: Full post details (copy, visual idea) -> Goal: Inform/Drill-down -> Viz/Method: Modal Window (JS). Justification: Keeps the main interface clean while providing easy access to detailed information on demand.
        - Report Info: Unscheduled ideas (Stories/Reels) -> Goal: Organize/Inform -> Viz/Method: Collapsible Accordion (HTML/JS). Justification: Separates evergreen ideas from the main, dated content plan in a space-efficient manner.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body {
            font-family: 'Jost', sans-serif;
            background-color: #121212;
            color: #F1F1F1;
        }
        .font-poppins {

        }
        .aliara-orange { color: #F85A40; }
        .aliara-yellow { color: #F9A826; }
        .bg-aliara-surface { background-color: #1E1E1E; }
        .bg-aliara-surface-light { background-color: #2A2A2A; }
        .border-aliara-orange { border-color: #F85A40; }
        .border-aliara-yellow { border-color: #F9A826; }
        .bg-aliara-orange { background-color: #F85A40; }
        .bg-aliara-yellow { background-color: #F9A826; }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }
        .calendar-day {
            transition: all 0.2s ease-in-out;
        }
        .calendar-day.has-post {
            cursor: pointer;
        }
        .calendar-day.has-post:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(248, 90, 64, 0.5);
        }
        .chart-container {
            position: relative;
            margin: auto;
            height: 300px;
            width: 100%;
            max-width: 300px;
        }
        .modal {
            transition: opacity 0.25s ease;
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
    </style>
</head>

            const calendarGrid = document.getElementById('calendar-grid');
            const pillarsGrid = document.getElementById('pillars-grid');
            const modal = document.getElementById('post-modal');
            const modalContent = document.getElementById('modal-content');
            const closeModalBtn = document.getElementById('close-modal-btn');
            
            function openModal(post) {
                document.getElementById('modal-title').textContent = post.title;
                document.getElementById('modal-date').textContent = post.date ? new Date(post.date + 'T00:00:00').toLocaleDateString('es-AR', { year: 'numeric', month: 'long', day: 'numeric' }) : 'Post Generado';
                document.getElementById('modal-visual').textContent = post.visual;
                document.getElementById('modal-copy').textContent = post.copy;
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modalContent.classList.remove('scale-95');
            }

            function closeModal() {
                modal.classList.add('opacity-0', 'pointer-events-none');
                modalContent.classList.add('scale-95');
            }

            closeModalBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal();
                }
            });

            function renderCalendar() {
                calendarGrid.innerHTML = '';
                const year = 2025;
                const month = 7;
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                for (let i = 0; i < firstDay; i++) {
                    calendarGrid.innerHTML += `<div class="border border-gray-800 p-2 h-24 md:h-32 rounded-md"></div>`;
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    const post = contentPlan.find(p => p.date === dateStr);
                    let dayCell = `<div class="calendar-day border border-gray-800 p-2 h-24 md:h-32 rounded-md bg-aliara-surface-light flex flex-col justify-between"><div>${day}</div>`;
                    if (post) {
                        dayCell = dayCell.replace('class="calendar-day', 'class="calendar-day has-post');
                        dayCell += `<div data-date="${dateStr}" class="bg-aliara-orange text-white text-xs font-bold p-1 rounded-md truncate">${post.title}</div>`;
                    }
                    dayCell += `</div>`;
                    calendarGrid.innerHTML += dayCell;
                }
                
                const lastDayOfMonth = new Date(year, month, daysInMonth);
                const remainingCells = 7 - (lastDayOfMonth.getDay() + 1);
                if(remainingCells < 7) {
                    for (let i = 0; i < remainingCells; i++) {
                        calendarGrid.innerHTML += `<div class="border border-gray-800 p-2 h-24 md:h-32 rounded-md"></div>`;
                    }
                }
                
                document.querySelectorAll('.has-post').forEach(cell => {
                    cell.addEventListener('click', (e) => {
                        const postDate = e.currentTarget.querySelector('[data-date]').dataset.date;
                        const post = contentPlan.find(p => p.date === postDate);
                        if (post) openModal(post);
                    });
                });
            }
            
            function renderPillars() {
                pillarsGrid.innerHTML = '';
                const pillars = [...new Set(contentPlan.map(p => p.pillar).filter(p => p))];
                pillars.forEach(pillar => {
                    const pillarPosts = contentPlan.filter(p => p.pillar === pillar);
                    const pillarCard = document.createElement('div');
                    pillarCard.className = 'bg-aliara-surface p-6 rounded-xl shadow-lg flex flex-col h-full';
                    
                    let postsHTML = pillarPosts.map(post => `
                        <div class="pillar-post bg-aliara-surface-light p-3 rounded-lg mb-2 cursor-pointer hover:bg-opacity-70" data-date="${post.date}">
                            <h4 class="font-bold truncate">${post.title}</h4>
                            <p class="text-sm text-gray-400">${post.date ? new Date(post.date + 'T00:00:00').toLocaleDateString('es-AR', { day: 'numeric', month: 'long' }) : 'Generado'}</p>
                        </div>
                    `).join('');
                    
                    pillarCard.innerHTML = `
                        <h3 class="text-2xl font-bold mb-4 aliara-yellow">${pillar}</h3>
                        <div class="space-y-2 flex-grow">${postsHTML}</div>
                    `;
                    pillarsGrid.appendChild(pillarCard);
                });

                document.querySelectorAll('.pillar-post').forEach(item => {
                    item.addEventListener('click', (e) => {
                        const postDate = e.currentTarget.dataset.date;
                        const post = contentPlan.find(p => p.date === postDate);
                        if (post) openModal(post);
                    });
                });
            }

            function renderPillarChart() {
                const pillarCounts = contentPlan.reduce((acc, post) => {
                    const pillarName = post.pillar.split(' ')[0];
                    if (pillarName) {
                        acc[pillarName] = (acc[pillarName] || 0) + 1;
                    }
                    return acc;
                }, {});

                const pillarData = {
                    labels: Object.keys(pillarCounts),
                    datasets: [{
                        data: Object.values(pillarCounts),
                        backgroundColor: ['#F85A40', '#F9A826', '#03A9F4', '#4CAF50', '#9C27B0', '#FF9800', '#E91E63', '#3F51B5'],
                        borderColor: '#1E1E1E',
                        borderWidth: 2
                    }]
                };

                const ctx = document.getElementById('pillarsChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: pillarData,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: {
                                    color: '#F1F1F1',
                                    font: {
                                        family: "'Jost', sans-serif"
                                    }
                                }
                            }
                        }
                    }
                });
            }

            function updateStats() {
                document.getElementById('total-posts').textContent = contentPlan.length;
                document.getElementById('total-pillars').textContent = [...new Set(contentPlan.map(p => p.pillar))].length;
                document.getElementById('total-stories').textContent = storiesIdeas.length;
                document.getElementById('total-reels').textContent = reelsIdeas.length;
            }

            function populateExtraIdeas() {
                const storiesList = document.getElementById('stories-list');
                storiesIdeas.forEach(idea => {
                    const li = document.createElement('li');
                    li.textContent = idea;
                    storiesList.appendChild(li);
                });

                const reelsList = document.getElementById('reels-list');
                reelsIdeas.forEach(idea => {
                    const li = document.createElement('li');
                    li.textContent = idea;
                    reelsList.appendChild(li);
                });
            }
            
            document.querySelectorAll('.accordion-header').forEach(header => {
                header.addEventListener('click', () => {
                    const content = header.nextElementSibling;
                    const icon = header.querySelector('span:last-child');
                    
                    if (content.style.maxHeight) {
                        content.style.maxHeight = null;
                        icon.style.transform = 'rotate(0deg)';
                    } else {
                        document.querySelectorAll('.accordion-content').forEach(c => c.style.maxHeight = null);
                        document.querySelectorAll('.accordion-header span:last-child').forEach(i => i.style.transform = 'rotate(0deg)');
                        content.style.maxHeight = content.scrollHeight + "px";
                        icon.style.transform = 'rotate(180deg)';
                    }
                });
            });

            const calendarView = document.getElementById('calendar-view');
            const pillarsView = document.getElementById('pillars-view');
            const calendarBtn = document.getElementById('view-calendar-btn');
            const pillarsBtn = document.getElementById('view-pillars-btn');

            calendarBtn.addEventListener('click', () => {
                calendarView.classList.remove('hidden');
                pillarsView.classList.add('hidden');
                calendarBtn.classList.add('bg-aliara-orange', 'text-white');
                calendarBtn.classList.remove('bg-gray-600');
                pillarsBtn.classList.remove('bg-aliara-orange', 'text-white');
                pillarsBtn.classList.add('bg-aliara-yellow', 'text-gray-900');
            });

            pillarsBtn.addEventListener('click', () => {
                pillarsView.classList.remove('hidden');
                calendarView.classList.add('hidden');
                pillarsBtn.classList.add('bg-aliara-orange', 'text-white');
                pillarsBtn.classList.remove('bg-aliara-yellow', 'text-gray-900');
                calendarBtn.classList.remove('bg-aliara-orange', 'text-white');
                calendarBtn.classList.add('bg-gray-600');
            });

            updateStats();
            renderPillarChart();
            renderCalendar();
            renderPillars();
            populateExtraIdeas();
            calendarBtn.click();
        });
    </script>
</body>
</html>
